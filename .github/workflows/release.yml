name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "patches-bundle.json"
      - "patches-list.json"

jobs:
  release:
    name: Build and publish Morphe patches
    permissions:
      contents: write
      packages: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Build Morphe bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gradle :patches:buildAndroid --no-daemon
          gradle generatePatchesList --no-daemon
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$MPP"
          mkdir -p dist
          cp "$MPP" dist/patches-1.0.2.mpp

      - name: Write source metadata
        run: |
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%S')"
          cat > patches-bundle.json <<EOF
          {
            "created_at": "$CREATED_AT",
            "description": "WhatsApp Morphe Patches v1.0.2 — experimental no-root patches for WhatsApp 2.26.27.4.",
            "download_url": "https://raw.githubusercontent.com/BOPBOP-glitch/WhatsApp-share/main/dist/patches-1.0.2.mpp",
            "signature_download_url": "",
            "version": "1.0.2"
          }
          EOF

      - name: Commit published source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patches-list.json patches-bundle.json dist/patches-1.0.2.mpp
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish Morphe source v1.0.2 [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-morphe-patches-1.0.2
          path: dist/patches-1.0.2.mpp
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: WhatsApp Morphe Patches v1.0.2
          body: Experimental no-root Morphe patches for WhatsApp 2.26.27.4.
          files: dist/patches-1.0.2.mpp
          make_latest: true
