name: Validate Compatibility

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Build compatibility bundle
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.7.1"

      - name: Verify frozen patch sources
        run: python3 scripts/verify_compatibility.py

      - name: Generate metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle generatePatchesList --no-daemon

      - name: Build Android bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradle :patches:buildAndroid --no-daemon

      - name: Validate bundle structure
        run: |
          set -euxo pipefail
          MPP="$(find patches/build/libs -maxdepth 1 -type f -name '*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -n 1)"
          test -n "$MPP"
          unzip -t "$MPP"
          unzip -Z1 "$MPP" | grep -E '\.dex$'
          python3 scripts/verify_compatibility.py

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-morphe-compatibility
          path: patches/build/libs/*.mpp
          if-no-files-found: error
